identity:
  name: run_actor
  author: publicrecords
  label:
    en_US: Run a Public Records Actor
    zh_Hans: 运行 Public Records Actor
    pt_BR: Executar um Actor Public Records
    ja_JP: Public Records Actor を実行
description:
  human:
    en_US: Starts an allowlisted Public Records Apify Actor with JSON input and optionally waits for it to finish. Uses only the Apify API token you entered as a credential. Runs are billed to your Apify account.
    zh_Hans: 使用您作为凭据输入的 Apify API 令牌，以 JSON 输入启动允许列表中的 Public Records Actor，并可等待其完成。运行费用记在您的 Apify 账户上。
    pt_BR: Inicia um Actor Public Records permitido com entrada JSON e, opcionalmente, espera a conclusão. Usa somente o token da API Apify que você informou como credencial. As execuções são cobradas na sua conta Apify.
    ja_JP: 許可リスト内の Public Records Actor を JSON 入力で開始し、必要なら完了まで待機します。認証情報として入力したご自身の Apify API トークンだけを使います。実行料金はご自身のアカウントに課金されます。
  llm: Run one allowlisted Public Records Apify Actor (id like publicrecords/etsy-search-scraper) with a JSON input object. Optionally wait for the run to finish and return the default dataset items. Only allowlisted publicrecords/* actors can be started. Call list_actors if you need the catalog. The user's own Apify API token is used; do not ask for or invent a token.
parameters:
  - name: actor
    type: select
    required: true
    label:
      en_US: Actor
      zh_Hans: Actor
      pt_BR: Actor
      ja_JP: Actor
    human_description:
      en_US: Allowlisted Public Records Actor to run.
      zh_Hans: 要运行的已允许 Public Records Actor。
      pt_BR: Actor Public Records permitido a executar.
      ja_JP: 実行する許可済み Public Records Actor。
    llm_description: The Public Records Actor to run, for example publicrecords/grants-gov-scraper or the short id grants-gov-scraper.
    form: llm
    options:
      - value: publicrecords/etsy-search-scraper
        label:
          en_US: "Etsy Search MCP - Listings, Prices & Best Sellers"
      - value: publicrecords/etsy-shop-velocity
        label:
          en_US: "Etsy Shop Daily Sales MCP"
      - value: publicrecords/sports-odds-api
        label:
          en_US: "Sports Odds API MCP - BetRivers, Unibet, Paf, Svenska Spel"
      - value: publicrecords/company-social-profile-finder
        label:
          en_US: "Company Social MCP - Website to LinkedIn & Social Links"
      - value: publicrecords/legistar-meetings-scraper
        label:
          en_US: "City Council Meetings MCP (Legistar)"
      - value: publicrecords/eu-ted-notices-scraper
        label:
          en_US: "EU TED Tenders MCP - Daily Procurement Notices"
      - value: publicrecords/govcon-opportunity-feed
        label:
          en_US: "Federal Contracts MCP - SAM.gov + Grants.gov"
      - value: publicrecords/grants-gov-scraper
        label:
          en_US: "Grants.gov MCP - Open Federal Grants"
      - value: publicrecords/usaspending-awards-scraper
        label:
          en_US: "USAspending Awards MCP - Federal Contract & Grant Awards"
      - value: publicrecords/uk-find-a-tender-scraper
        label:
          en_US: "UK Tenders MCP - Find a Tender & Contracts Finder"
      - value: publicrecords/ashby-jobs-scraper
        label:
          en_US: "Ashby Jobs MCP - New Postings Since Any Date"
      - value: publicrecords/lever-jobs-scraper
        label:
          en_US: "Lever Jobs MCP - New Postings Since Any Date"
      - value: publicrecords/spotify-play-count-scraper
        label:
          en_US: "Spotify Play Count & Monthly Listeners MCP"
      - value: publicrecords/google-ads-transparency-scraper
        label:
          en_US: "Google Ads Transparency MCP - Competitor Ads"
      - value: publicrecords/calibration-ledger
        label:
          en_US: "Calibration Ledger MCP - Forecast Track Records (beta)"
      - value: publicrecords/greenhouse-jobs-scraper
        label:
          en_US: "Greenhouse Jobs MCP - New Postings Since Any Date"
      - value: publicrecords/smartrecruiters-jobs-scraper
        label:
          en_US: "SmartRecruiters Jobs MCP - New Postings Since Any Date"
      - value: publicrecords/tennis-scores-api
        label:
          en_US: "Tennis Scores API - ATP & WTA Live Scores, Results, Rankings"
  - name: input_json
    type: string
    required: true
    label:
      en_US: Actor input JSON
      zh_Hans: Actor 输入 JSON
      pt_BR: JSON de entrada do Actor
      ja_JP: Actor 入力 JSON
    human_description:
      en_US: JSON object of Actor input fields. See the Actor's Apify Store page for the schema.
      zh_Hans: Actor 输入字段的 JSON 对象。字段说明见该 Actor 的 Apify Store 页面。
      pt_BR: Objeto JSON com os campos de entrada do Actor. Consulte a página da Store para o esquema.
      ja_JP: Actor 入力フィールドの JSON オブジェクト。スキーマは Apify Store の各 Actor ページを参照してください。
    llm_description: A JSON object (or a JSON string) with the Actor input. Use the Store page for required fields. Example for etsy-search-scraper - {"query":"handmade jewelry","maxItems":20}.
    form: llm
  - name: wait_for_finish
    type: number
    required: false
    default: 90
    min: 0
    max: 150
    label:
      en_US: Wait for finish (seconds)
      zh_Hans: 等待完成（秒）
      pt_BR: Esperar conclusão (segundos)
      ja_JP: 完了待ち（秒）
    human_description:
      en_US: Seconds to wait for the run to finish (0 starts the run and returns immediately). Capped at 150.
      zh_Hans: 等待运行完成的秒数（0 表示立即返回）。上限为 150。
      pt_BR: Segundos para esperar a execução terminar (0 inicia e retorna imediatamente). Máximo 150.
      ja_JP: 実行完了まで待つ秒数（0 は開始してすぐ戻る）。上限は 150 です。
    llm_description: Optional seconds to wait for the run to finish, 0 to 150. Default 90. Use 0 when you only need the run id.
    form: llm
  - name: max_items
    type: number
    required: false
    default: 25
    min: 1
    max: 100
    label:
      en_US: Max dataset items
      zh_Hans: 最多返回条目
      pt_BR: Máximo de itens
      ja_JP: 取得する最大件数
    human_description:
      en_US: Maximum items to fetch from the default dataset when the run succeeds (1-100).
      zh_Hans: 运行成功后从默认数据集获取的最大条目数（1-100）。
      pt_BR: Máximo de itens a obter do dataset padrão quando a execução for bem-sucedida (1-100).
      ja_JP: 実行成功時にデフォルトデータセットから取得する最大件数（1-100）。
    llm_description: Optional maximum number of default-dataset items to return when the run finishes successfully, 1 to 100, default 25.
    form: llm
extra:
  python:
    source: tools/run_actor.py
