identity:
  name: get_dataset_items
  author: publicrecords
  label:
    en_US: Get Apify dataset items
    zh_Hans: 获取 Apify 数据集条目
    pt_BR: Obter itens do dataset da Apify
    ja_JP: Apify データセットの項目を取得
description:
  human:
    en_US: Fetches items from an Apify dataset (for example the default dataset of a run you started). Uses only the Apify API token you entered as a credential.
    zh_Hans: 从 Apify 数据集获取条目（例如您启动的运行的默认数据集）。仅使用您作为凭据输入的 Apify API 令牌。
    pt_BR: Obtém itens de um dataset da Apify (por exemplo, o dataset padrão de uma execução que você iniciou). Usa somente o token que você informou como credencial.
    ja_JP: Apify データセット（開始した実行のデフォルトデータセットなど）から項目を取得します。認証情報として入力したトークンだけを使います。
  llm: Fetch items from an Apify dataset id, typically the default_dataset_id returned by run_actor. Uses the user's own Apify API token.
parameters:
  - name: dataset_id
    type: string
    required: true
    label:
      en_US: Dataset ID
      zh_Hans: 数据集 ID
      pt_BR: ID do dataset
      ja_JP: データセット ID
    human_description:
      en_US: Apify dataset id, usually default_dataset_id from a previous run_actor result.
      zh_Hans: Apify 数据集 ID，通常来自先前 run_actor 结果中的 default_dataset_id。
      pt_BR: ID do dataset da Apify, geralmente default_dataset_id de um resultado anterior de run_actor.
      ja_JP: Apify データセット ID。通常は run_actor の結果の default_dataset_id です。
    llm_description: The Apify dataset id to read, usually default_dataset_id from run_actor.
    form: llm
  - name: limit
    type: number
    required: false
    default: 25
    min: 1
    max: 100
    label:
      en_US: Limit
      zh_Hans: 条数上限
      pt_BR: Limite
      ja_JP: 上限
    human_description:
      en_US: Maximum items to return (1-100). Default 25.
      zh_Hans: 返回的最大条目数（1-100）。默认 25。
      pt_BR: Máximo de itens a retornar (1-100). Padrão 25.
      ja_JP: 返す最大件数（1-100）。デフォルトは 25。
    llm_description: Maximum items to return, 1 to 100, default 25.
    form: llm
  - name: offset
    type: number
    required: false
    default: 0
    min: 0
    max: 100000
    label:
      en_US: Offset
      zh_Hans: 偏移
      pt_BR: Deslocamento
      ja_JP: オフセット
    human_description:
      en_US: Number of items to skip. Default 0.
      zh_Hans: 要跳过的条目数。默认 0。
      pt_BR: Número de itens a ignorar. Padrão 0.
      ja_JP: スキップする件数。デフォルトは 0。
    llm_description: Number of items to skip, default 0.
    form: llm
extra:
  python:
    source: tools/get_dataset_items.py
